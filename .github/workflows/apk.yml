name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versao (VERSION_CODE e VERSION_NAME)
        run: |
          VERSION_CODE=$((10000 + ${{ github.run_number }}))
          VERSION_NAME="2.0.${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Versao: $VERSION_NAME ($VERSION_CODE)"

      - name: Validar secrets de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && { [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KEY_PASS" ]; }; then
            echo "::error::KEYSTORE_B64 existe, mas faltam KEYSTORE_PASSWORD, KEY_ALIAS ou KEY_PASSWORD."
            exit 1
          fi

      - name: Informar o repositorio ao app (para checar atualizacoes)
        run: sed -i "s#__REPO__#${{ github.repository }}#g" app/src/main/java/com/ascplay/app/Updater.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar o APK
        run: gradle assembleRelease --no-daemon

      - name: Assinar o APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem chave fixa nos Secrets. APK so para teste: nao sera publicado."
            keytool -genkeypair -keystore release.keystore -storepass android -keypass android -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ASC Play"
            KS_PASS=android; KS_ALIAS=key0; KEY_PASS=android
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          IN=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$BT/zipalign" -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out ASC-play.apk aligned.apk
          "$BT/apksigner" verify --print-certs ASC-play.apk
          rm -f release.keystore aligned.apk

      - name: Criar version.json
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          SHA=$(sha256sum ASC-play.apk | cut -d' ' -f1)
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --arg sha "$SHA" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/v${VERSION_CODE}/ASC-play.apk" \
            --arg notes "$NOTES" '{code:$code,name:$name,url:$url,sha256:$sha,notes:$notes}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: ASC-play-apk
          path: ASC-play.apk

      - name: Publicar Release (download e atualizacao)
        if: env.HAS_KEY == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ASC-play.apk version.json --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" ASC-play.apk version.json --title "ASC play ${VERSION_NAME}" --notes "Versao ${VERSION_NAME}" --latest
          fi
