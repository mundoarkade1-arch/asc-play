name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Informar o repositorio ao app (para checar atualizacoes)
        run: sed -i "s#__REPO__#${{ github.repository }}#g" www/index.html
      - name: Instalar dependencias (versoes travadas pelo package-lock.json)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json nao existe ainda: gerando agora."
            npm install
          fi
      - name: Salvar package-lock.json no repositorio (so na primeira vez)
        if: github.ref_name == 'main'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Adiciona package-lock.json"
            git push || echo "::warning::Nao consegui salvar o package-lock.json (tente rodar o workflow de novo)."
          fi
      - run: npx cap add android
      - run: bash scripts/setup.sh
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Assinar o APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem chave fixa nos Secrets. APK so para teste: nao sera publicado."
            keytool -genkeypair -keystore release.keystore -storepass android -keypass android -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ASC Play"
            KS_PASS=android; KS_ALIAS=key0; KEY_PASS=android
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          "$BT/zipalign" -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out ASC-play.apk aligned.apk
          "$BT/apksigner" verify --print-certs ASC-play.apk
          rm -f release.keystore aligned.apk
      - name: Criar version.json
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          SHA=$(sha256sum ASC-play.apk | cut -d' ' -f1)
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --arg sha "$SHA" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/v${VERSION_CODE}/ASC-play.apk" \
            --arg notes "$NOTES" '{code:$code,name:$name,url:$url,sha256:$sha,notes:$notes}' > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: ASC-play-apk
          path: ASC-play.apk
      - name: Publicar Release (download e atualizacao)
        if: env.HAS_KEY == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION_CODE}" ASC-play.apk version.json --title "ASC play ${VERSION_NAME}" --notes "Versao ${VERSION_NAME}" --latest
